dataset: imagenet
num_classes: 1000
img_size: 224
mean:
    - 0.485
    - 0.456
    - 0.406
std:
    - 0.229
    - 0.224
    - 0.225
crop_pct: 1.0
scale:
    - 1.0
    - 1.0
interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-mstd0.5-inc1
mixup: 0.8
mixup_off_epoch: 0
mixup_prob: 0
mixup_mode: batch
mixup_switch_prob: 0.25
cutmix: 1.0
reprob: 0.25
remode: const
amp: True
batch_size: 16
val_batch_size: 16
lr: 5e-4
min_lr: 0.000001
sched: cosine
weight_decay: 5e-4
epochs: 40
cooldown_epochs: 0
warmup_epochs: 0
warmup_lr: 0.000001
opt: adamW
workers: 12
